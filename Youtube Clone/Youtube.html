<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="Youtube.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="left">
            <img src="https://img.icons8.com/material-rounded/24/menu.png" class="icon">
            <img src="https://www.logo.wine/a/logo/YouTube/YouTube-Logo.wine.svg" class="logo">
        </div>

        <div class="center">
            <input type="text" placeholder="Search">
            <button class="search-btn">
                <img src="https://img.icons8.com/ios-filled/20/search.png">
            </button>
        </div>

        <div class="right">
            <img src="https://img.icons8.com/material-outlined/24/video-call.png" class="icon">
            <img src="https://img.icons8.com/material-rounded/24/appointment-reminders.png" class="icon">
            <img src="https://img.icons8.com/material-rounded/32/user.png" class="profile">
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="#"><img src="https://img.icons8.com/ios-glyphs/24/home.png"> Home</a>
        <a href="#"><img src="https://img.icons8.com/ios-glyphs/24/youtube-shorts.png"> Shorts</a>
        <a href="#"><img src="https://img.icons8.com/ios-glyphs/24/youtube-play.png"> Subscriptions</a>
        <hr>
        <a href="#"><img src="https://img.icons8.com/ios-glyphs/24/user.png"> Your Channel</a>
        <a href="#"><img src="https://img.icons8.com/ios-glyphs/24/history.png"> History</a>
    </aside>

    <!-- Main Content -->
    <main class="videos">

        <div class="card">
            <img src="https://i.ytimg.com/vi/ysz5S6PUM-U/maxresdefault.jpg" class="thumbnail">
            <div class="info">
                <img src="https://img.icons8.com/ios-filled/50/user-male-circle.png" class="channel">
                <div>
                    <h4>Sample Video Title</h4>
                    <p>Channel Name • 1M views • 1 year ago</p>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://i.ytimg.com/vi/ScMzIvxBSi4/maxresdefault.jpg" class="thumbnail">
            <div class="info">
                <img src="https://img.icons8.com/ios-filled/50/user-male-circle.png" class="channel">
                <div>
                    <h4>Another Video Title</h4>
                    <p>Channel 2 • 500K views • 2 months ago</p>
                </div>
            </div>
        </div>

        <!-- More cards can be added -->
    </main>

</body>
</html>
